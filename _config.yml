# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.

# Basic Site Settings
locale                 : "en-US"
site_theme             : "default" # The available themes options are "default", "air", "sunrise", "mint", "dirt" and "contrast"
title                  : "Kingsley Asare Boakye"
title_separator        : "-"
name                   : &name "Kingsley Asare Boakye"
description            : &description "Doctoral Researcher in Geotechnical Engineering | Machine Learning & Reliability Analysis"
url                    : https://kasareboakye.github.io # The base hostname & protocol for your site
baseurl                : "" # the subpath of your site, e.g. "/blog"
repository             : "kasareboakye/kasareboakye.github.io"

# Site Author - The following control what appear as part of the author content on the side bar.
author:
  # Biographic information
  avatar             : "profile.png"
  name               : "Kingsley Asare Boakye"
  pronouns           :   
  bio                : "Doctoral Researcher at Chonnam National University specializing in geotechnical reliability, acoustic signal processing, and physics-informed neural networks."
  location           : "Gwangju, South Korea"
  employer           : "Chonnam National University"
  uri                : 
  email              : "your.email@chonnam.ac.kr" # Update with your professional email

  # Academic websites
  academia           : 
  arxiv              : 
  googlescholar      : "" # Add your Google Scholar URL here if you have one
  inspire-hep        : 
  impactstory        : 
  orcid              : "" # Add your ORCID URL here if you have one
  semantic           : 
  ssrn               : 
  pubmed             : 
  researchgate       : "" # Add your ResearchGate URL here if you have one
  scopus             : 
  zotero             : 

  # Repositories and software development
  bitbucket          : 
  codepen            : 
  dribbble           : 
  github             : "kasareboakye"
  kaggle             :  
  stackoverflow      : 

  # Social media
  artstation         : 
  bluesky            : 
  facebook           : 
  flickr             : 
  foursquare         : 
  goodreads          : 
  google_plus        : 
  keybase            : 
  instagram          : 
  lastfm             : 
  linkedin           : "" # Add your LinkedIn username/URL if desired
  mastodon           : 
  medium             : 
  pinterest          : 
  soundcloud         : 
  steam              : 
  telegram           : 
  tumblr             : 
  twitter            : 
  vine               : 
  weibo              : 
  wikipedia          : 
  xing               : 
  youtube            : 
  zhihu              : 

# Publication Category - The following the list of publication categories and their headings
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                 :  # filename of teaser fallback teaser image placed in /images/ for social media previews
breadcrumbs            : false # true, false (default)
words_per_minute       : 160
future                 : true
read_more              : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link           : false      # change to true to add link to talkmap on talks page
comments:
  provider             : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname          :
  discourse:
    server             : 
  facebook:
    appid              : 
    num_posts          : 
    colorscheme        : 
staticman:
  allowedFields        : ['name', 'email', 'url', 'message']
  branch               : "gh-pages" 
  commitMessage        : "New comment."
  filename             : comment-{@timestamp}
  format               : "yml"
  moderation           : true
  path                 : "_data/comments/{options.slug}"
  requiredFields       : ['name', 'email', 'message']
  transforms:
    email              : "md5"
  generatedFields:
    date:
      type             : "date"
      options:
        format         : "iso8601"
atom_feed:
  hide                 : false      # change to true to hide the RSS feed in the footer
  path                 : 

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username             : &twitter
facebook:
  username             : 
  app_id               : 
  publisher            : 
og_image               : og-image.png   # Social media default site image (lives in /images/)
og_description         :  
social:
  type                 : 
  name                 : 
  links: 

# Analytics
analytics:
  provider             : "false" 
  google:
    tracking_id        : 

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# These settings control the types of collections used by the template
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# These settings control how pages and collections are included in the site
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed 

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC 

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
